name: Research reproducibility and API checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r engine/requirements.lock.txt
          .venv/bin/python -m pip check
      - run: npm ci
      - run: PYTHONPATH=engine .venv/bin/python -m pytest -q engine/tests
      - run: PYTHONPATH=engine .venv/bin/python scripts/export-financial-definitions.py --check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node web/tests/research-flow.mjs
      - run: node web/tests/research-dom.mjs
      - run: node web/tests/statistical-dom.mjs
      - run: node web/tests/factor-workbench-dom.mjs
      - run: node web/tests/universe-filter-dom.mjs
      - run: node web/tests/universe-legacy-dom.mjs
      - run: node web/tests/market-preparation-dom.mjs
      - run: node web/tests/market-admission-adversarial-dom.mjs
      - run: node web/tests/market-trend-admission-dom.mjs
      - run: node web/tests/factor-diagnostics-dom.mjs
      - run: node web/tests/model-function-editor-dom.mjs
      - run: node web/tests/model-report-first-dom.mjs
      - run: node web/tests/financial-workspace-dom.mjs
      - run: node web/tests/financial-acquisition-dom.mjs
      - run: node web/tests/dataset-workspace-dom.mjs
      - run: node web/tests/dataset-workspace-dom.mjs --graph
      - run: node web/tests/sharded-report-dom.mjs
      - run: node web/tests/report-continuation-dom.mjs
      - run: node web/tests/studio-semantics-dom.mjs
      - run: node web/tests/studio-evidence-adversarial-dom.mjs
      - name: Reproduce the complete synthetic report
        run: |
          .venv/bin/python scripts/local-run.py engine/examples/basic.json --source demo --output private/first.json
          .venv/bin/python scripts/local-run.py engine/examples/basic.json --source demo --output private/second.json
          cmp private/first.json private/second.json
      - name: Reproduce the basket residual research report
        run: |
          .venv/bin/python scripts/local-run.py engine/examples/stat-arb.json --source demo --output private/residual-first.json
          .venv/bin/python scripts/local-run.py engine/examples/stat-arb.json --source demo --output private/residual-second.json
          cmp private/residual-first.json private/residual-second.json
      - name: Reproduce immutable forecasts and independently audit execution
        run: |
          .venv/bin/python scripts/local-run.py engine/examples/statistical-quant.json --source demo --output private/forecast-first.json --snapshot-output private/forecast-input.json
          .venv/bin/python scripts/local-run.py engine/examples/statistical-quant.json --source demo --output private/forecast-second.json
          cmp private/forecast-first.json private/forecast-second.json
          .venv/bin/python scripts/audit-report.py private/forecast-first.json
          .venv/bin/python scripts/replay-execution.py private/forecast-first.json private/forecast-input.json --output private/execution.json
          .venv/bin/python scripts/audit-report.py private/execution.json --source-report private/forecast-first.json
      - name: Reproduce complete bundle transport and independently audit the frozen replay
        run: |
          .venv/bin/python scripts/local-run.py engine/examples/statistical-quant.json --source demo --bundle-output private/forecast-bundle
          .venv/bin/python scripts/audit-bundle.py private/forecast-bundle
          .venv/bin/python scripts/replay-execution.py --source-bundle private/forecast-bundle --bundle-output private/execution-bundle
          .venv/bin/python scripts/audit-bundle.py private/execution-bundle --source-bundle private/forecast-bundle
